<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Jonathan Kelchner">
    <meta name="description" content="This is the contact us page of my project">
	<meta name="keywords" content="Sumo, wrestling, grappling, fighting, info, informative">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Contact Us</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="manifest" href="site.webmanifest">
</head>
<body class="hidden">
	<header>
		<h1>Contact Us</h1>
		<nav>
			<ul>
				<li class="home_li_left"><a class="dark_anchor" href="index.html">Home</a></li>
				<li class="home_li_center"><a class="dark_anchor" href="static.html">Sumo 101</a></li>
				<li class="home_li_center"><a class="dark_anchor" href="twostep.html">In-Depth Sumo Topics</a></li>
				<li class="home_li_right current"><a class="light_anchor" href="contact.html">Contact Us</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<form id="input_form">
			<label>
				Enter your email:
				<input id="input_email" type="email" autocomplete="email" required />
			</label>
			<label>
				Questions, comments, or concerns? Tell us!:
				<textarea id="input_text" autocomplete="off" required></textarea>
			</label>
			<button id="input_button" type="submit">Submit</button>
		</form>
		<p id="input_message" role="status"></p>
	</main>
	<footer>
		<p>2026 Jonathan Kelchner</p>
		<a href="credits.html">Photo Credits</a>
	</footer>
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
		import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
		import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

		const firebaseConfig = {
            apiKey: "AIzaSyBNUbUumU90CqiCDBVnInWgC260Y-7_s3U",
            authDomain: "csci3054-project5-sumo.firebaseapp.com",
            projectId: "csci3054-project5-sumo",
            storageBucket: "csci3054-project5-sumo.firebasestorage.app",
            messagingSenderId: "802652125302",
            appId: "1:802652125302:web:36d6daf59468e01a960757"
        };

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const db = getFirestore(app);

		onAuthStateChanged(auth, (user) => {
			if (!user) {
				window.location.replace("login.html");
				return;
			}

			document.body.classList.remove("hidden");
		});

		const inputForm = document.querySelector("#input_form");
		const message = document.querySelector("#input_message");
		const inputEmail = document.querySelector("#input_email");
		const inputText = document.querySelector("#input_text");

		inputForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			message.textContent = "";

			try {
                await addDoc(collection(db, "user_input"), {
					email: inputEmail.value.trim(),
					text: inputText.value
				});
				inputForm.reset();
				message.textContent = "Your message has been received. Thank you for your feedback!";
            } catch (error) {
                message.textContent = "Something went wrong, please try again later!";
            }
		});
	</script>
</body>
</html>
